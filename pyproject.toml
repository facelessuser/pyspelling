[build-system]
requires = [
    "hatchling>=0.21.1",
]
build-backend = "hatchling.build"

[project]
name = "pyspelling"
description = "Spell checker."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Isaac Muse", email = "Isaac.Muse@gmail.com" },
]
keywords = [
    "spelling"
]

dependencies = [
    "beautifulsoup4",
    "soupsieve>=3.0.1",
    "markdown",
    "pyyaml",
    "wcmatch>=8.5",
    "lxml",
    "html5lib"
]
dynamic = [
    "classifiers",
    "version",
    "scripts"
]

[project.urls]
Homepage = "https://github.com/facelessuser/pyspelling"

[tool.hatch.version]
source = "code"
path = "pyspelling/__meta__.py"

[tool.hatch.build.targets.wheel]
include = [
    "/pyspelling",
]

[tool.hatch.build.targets.sdist]
include = [
    "/docs/src/markdown/**/*.md",
    "/docs/src/markdown/**/*.gif",
    "/docs/src/markdown/**/*.png",
    "/docs/src/markdown/dictionary/*.txt",
    "/docs/theme/**/*.css",
    "/docs/theme/**/*.js",
    "/docs/theme/**/*.html",
    "/requirements/*.txt",
    "/pyspelling/**/*.py",
    # "/pyspelling/py.typed",
    "/tests/**/*.py",
    "/tests/test_files/odf/*.fodt",
    "/tests/test_files/odf/*.odp",
    "/tests/test_files/odf/*.ods",
    "/tests/test_files/odf/*.odt",
    "/tests/test_files/ooxml/*.docx",
    "/tests/test_files/ooxml/*.pptx",
    "/tests/test_files/ooxml/*.xlsx",
    "/.pyspelling.yml",
    "/.coveragerc",
    "/mkdocs.yml"
]

# TODO
# [tool.mypy]
# files = [
#     "pyspelling"
# ]
# strict = true
# show_error_codes = true

[tool.hatch.metadata.hooks.custom]

[tool.ruff]
line-length = 120

lint.select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "D",    # pydocstyle
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "E",    # pycodestyle
    "F",    # pyflakes
    "PGH",  # pygrep-hooks
    "RUF",  # ruff
    # "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020,
    "PERF"  # Perflint
]

lint.ignore = [
    "E741",
    "D202",
    "D401",
    "D212",
    "D203",
    "D417",
    "N802",
    "N801",
    "N803",
    "N806",
    "N818",
    "RUF012",
    "RUF005",
    "PGH004",
    "RUF100"
]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_lines = [
    "pragma: no cover",
    "@overload"
]

[tool.hatch.envs.dev]
dependencies = [
    "pytest",
    "pytest-cov",
    "coverage",
    "mypy",
    "ruff",
    "build"
]

[tool.hatch.envs.docs]
dependencies = [
    "zensical",
    "markdown",
    "pymdown-extensions",
    "zensical-pymdownx @ git+https://github.com/facelessuser/pymdownx-zensical-theme.git",
    "pymdown_lexers @ git+https://github.com/facelessuser/pymdown-lexers.git",
    "build",
    "python-minifier"
]

[[tool.hatch.envs.dev.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[[tool.hatch.envs.dev-stdlib.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.dev.scripts]
types = "mypy"
tests = "pytest --cov pyspelling --cov-append --cov-report term-missing --cov-report xml --cov-report html:.cov tests"
lint = 'ruff check .'

[tool.hatch.envs.docs.scripts]
spellcheck = [
    "python -m zensical build -f zensical.yml --clean --strict; pyspelling"
]
clean = [
    "python -m zensical build -f zensical.yml --clean"
]
serve = [
    "python -m zensical serve -f zensical.yml"
]
build = [
    "python -m zensical build -f zensical.yml --clean"
]

